name = "magma_verify"
version = "0.1.0"
defaultTargets = ["Magma"]
lintDriver = "fmt"
lintDriverArgs = ["format", "--check", "--workers", "2"]

leanOptions = [
  { name = "backward.privateInPublic", value = true },
  { name = "backward.privateInPublic.warn", value = false }
]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.36.0-rc2"

[[require]]
name = "axiom-audit"
git = "https://github.com/leanprover-community/axiom-audit"
rev = "0b885d88a69982cd76990b502742690b80b1a685"

[[require]]
name = "aeneas"
path = "tools/aeneas/backends/lean"

[[require]]
name = "lean-fmt"
git = "https://github.com/jcreinhold/lean-fmt.git"
rev = "4ed3cda34c63e71d57b001dd15b814c9920f7b65"

[[lean_lib]]
name = "Magma"

[[lean_exe]]
name = "fmt"
root = "Fmt"
supportInterpreter = true
weakLinkArgs = ["-lLake"]
